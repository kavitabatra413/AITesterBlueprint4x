          - region "Options" [ref=f49e480]:
            - generic [ref=f49e482]:
              - generic [ref=f49e483]:
                - generic [ref=f49e484]: Protocol Era
                - paragraph [ref=f49e485]: Which MCP protocol era to negotiate with this server (independent of the transport). Legacy uses the 2025-11-25 initialize handshake; Auto probes server/discover and falls back to legacy; Modern pins the 2026-07-28 sessionless protocol. Defaults to Legacy — debugging tools should not auto-probe.
                - textbox "Protocol Era" [ref=f49e487] [cursor=pointer]: Legacy (2025-11-25 handshake)
              - generic [ref=f49e489]:
                - checkbox "Auto Refresh on List Changed Notifications" [ref=f49e491] [cursor=pointer]
                - generic [ref=f49e492] [cursor=pointer]:
                  - generic [ref=f49e493]: Auto Refresh on List Changed Notifications
                  - paragraph [ref=f49e494]: When checked, tool/prompt/resource lists refresh automatically when the server sends a */list_changed notification. When unchecked, the list-changed indicator appears and you refresh on demand.
              - generic [ref=f49e496]:
                - checkbox "Fetch Lists One Page at a Time" [ref=f49e498] [cursor=pointer]
                - generic [ref=f49e499] [cursor=pointer]:
                  - generic [ref=f49e500]: Fetch Lists One Page at a Time
                  - paragraph [ref=f49e501]: When checked, the Tools, Resources, and Prompts lists load a single page and reveal a “Load next page” control instead of auto-loading every page. Useful defensively for servers with very large lists. The per-list sidebar toggle sets this too.
              - generic [ref=f49e503]:
                - checkbox "Suppress Notification Stream" [ref=f49e505] [cursor=pointer]
                - generic [ref=f49e506] [cursor=pointer]:
                  - generic [ref=f49e507]: Suppress Notification Stream
                  - paragraph [ref=f49e508]: Legacy era only. When checked, the Inspector does not open the standalone GET notification stream after the initialize handshake. Server-to-client notifications that are not part of a request's own response — list changes, resource updates, standalone logs — will not arrive while this is on. Use it to test whether a server that answers initialize but then times out every request cannot serve a second concurrent request, and to inspect such a server anyway. Modern-era connections never open this stream and are unaffected. Takes effect on the next connect.
              - generic [ref=f49e509]:
                - generic [ref=f49e510]: Network Log Size
                - paragraph [ref=f49e511]: Maximum number of HTTP requests kept in the Network log for this server. Older entries rotate out past this limit; a response body that arrives after its entry rotated out is dropped. Use 0 for unlimited (not recommended). Applies immediately to the active connection.
