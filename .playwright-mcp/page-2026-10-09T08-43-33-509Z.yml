          - region "Options" [ref=e1684]:
            - generic [ref=e1686]:
              - generic [ref=e1687]:
                - generic [ref=e1688]: Protocol Era
                - paragraph [ref=e1689]: Which MCP protocol era to negotiate with this server (independent of the transport). Legacy uses the 2025-11-25 initialize handshake; Auto probes server/discover and falls back to legacy; Modern pins the 2026-07-28 sessionless protocol. Defaults to Legacy — debugging tools should not auto-probe.
                - textbox "Protocol Era" [ref=e1691] [cursor=pointer]: Legacy (2025-11-25 handshake)
              - generic [ref=e1693]:
                - checkbox "Auto Refresh on List Changed Notifications" [ref=e1695] [cursor=pointer]
                - generic [ref=e1696] [cursor=pointer]:
                  - generic [ref=e1697]: Auto Refresh on List Changed Notifications
                  - paragraph [ref=e1698]: When checked, tool/prompt/resource lists refresh automatically when the server sends a */list_changed notification. When unchecked, the list-changed indicator appears and you refresh on demand.
              - generic [ref=e1700]:
                - checkbox "Fetch Lists One Page at a Time" [ref=e1702] [cursor=pointer]
                - generic [ref=e1703] [cursor=pointer]:
                  - generic [ref=e1704]: Fetch Lists One Page at a Time
                  - paragraph [ref=e1705]: When checked, the Tools, Resources, and Prompts lists load a single page and reveal a “Load next page” control instead of auto-loading every page. Useful defensively for servers with very large lists. The per-list sidebar toggle sets this too.
              - generic [ref=e1707]:
                - checkbox "Suppress Notification Stream" [ref=e1709] [cursor=pointer]
                - generic [ref=e1710] [cursor=pointer]:
                  - generic [ref=e1711]: Suppress Notification Stream
                  - paragraph [ref=e1712]: Legacy era only. When checked, the Inspector does not open the standalone GET notification stream after the initialize handshake. Server-to-client notifications that are not part of a request's own response — list changes, resource updates, standalone logs — will not arrive while this is on. Use it to test whether a server that answers initialize but then times out every request cannot serve a second concurrent request, and to inspect such a server anyway. Modern-era connections never open this stream and are unaffected. Takes effect on the next connect.
              - generic [ref=e1713]:
                - generic [ref=e1714]: Network Log Size
                - paragraph [ref=e1715]: Maximum number of HTTP requests kept in the Network log for this server. Older entries rotate out past this limit; a response body that arrives after its entry rotated out is dropped. Use 0 for unlimited (not recommended). Applies immediately to the active connection.
